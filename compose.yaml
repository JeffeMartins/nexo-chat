name: conversa-chat
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-env
    DATABASE_URL: postgresql://conversa:${DB_PASSWORD:?Run npm run setup}@postgres:5432/conversa
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run npm run setup}@redis:6379
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
    INSTANCE_ID: api-1
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  mem_limit: 512m
  read_only: true
  tmpfs: ["/tmp:size=32m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conversa
      POSTGRES_USER: conversa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup}
    volumes: ["chat-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U conversa -d conversa"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run npm run setup}
    command:
      [
        redis-server,
        --requirepass,
        "${REDIS_PASSWORD}",
        --maxmemory,
        128mb,
        --maxmemory-policy,
        noeviction,
        --appendonly,
        "no",
        --save,
        "",
      ]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped
  api:
    <<: *api
    ports: ["127.0.0.1:8100:8080"]
  api-2:
    <<: *api
    profiles: [scale-test]
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    ports: ["127.0.0.1:8101:8080"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3100:8080"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 96m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  chat-data:
