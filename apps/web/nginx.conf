map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /health { default_type text/plain; return 200 'ok'; }
 location /api/ {
  proxy_pass http://api:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /socket.io/ {
  proxy_pass http://api:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_read_timeout 70s;
  proxy_send_timeout 70s;
  proxy_buffering off;
 }
 location /assets/ { try_files $uri =404; expires 1y; }
 location / { try_files $uri /index.html; expires -1; }
}
