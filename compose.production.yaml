services:
  api:
    ports: !reset []
    environment:
      APP_ORIGIN: https://${CHAT_DOMAIN:?Set CHAT_DOMAIN to a real hostname}
  api-2:
    ports: !reset []
    environment:
      APP_ORIGIN: https://${CHAT_DOMAIN:?Set CHAT_DOMAIN to a real hostname}
  web:
    ports: !reset []
  edge:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:?Set CHAT_DOMAIN to a real hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      web: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
volumes:
  tls-data:
  tls-config:
